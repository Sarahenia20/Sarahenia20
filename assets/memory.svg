<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Dawn memory architecture: medallion layers, SurrealDB knowledge graph, RAG and Redis CAG feeding the LLM, then human approval">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b96bb"/></marker>
<clipPath id="r"><rect width="1200" height="470" rx="28"/></clipPath>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="0.55" stop-color="#9b6bff"/><stop offset="1" stop-color="#f472b6"/></linearGradient></defs>
<g clip-path="url(#r)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1200" height="470" fill="#0a0f1f"/>
<text x="48" y="50" fill="#5b8cff" font-size="13" font-weight="700" letter-spacing="2.5">INSIDE DAWN  ·  MEMORY ARCHITECTURE</text>
<text x="48" y="88" fill="#e8ecff" font-size="30" font-weight="700">Graph memory, RAG and CAG</text>
<text x="48" y="118" fill="#8b96bb" font-size="16">The agent never starts from zero: every call gets current context from cache and relevant history from the graph.</text><rect x="48" y="150" width="270" height="76" rx="22" fill="#10172e" stroke="#d08b4c" stroke-width="1.6"/>
<text x="72" y="180" fill="#d08b4c" font-size="13" font-weight="700" letter-spacing="2">BRONZE</text>
<text x="72" y="202" fill="#e8ecff" font-size="14">Raw meetings, users</text>
<text x="298" y="180" text-anchor="end" fill="#8b96bb" font-size="12">SurrealDB</text><path d="M183,228 L183,242" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/><rect x="48" y="246" width="270" height="76" rx="22" fill="#10172e" stroke="#b8c2d6" stroke-width="1.6"/>
<text x="72" y="276" fill="#b8c2d6" font-size="13" font-weight="700" letter-spacing="2">SILVER</text>
<text x="72" y="298" fill="#e8ecff" font-size="14">Tasks, decisions, embeddings</text>
<text x="298" y="276" text-anchor="end" fill="#8b96bb" font-size="12">SurrealDB</text><path d="M183,324 L183,338" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/><rect x="48" y="342" width="270" height="76" rx="22" fill="#10172e" stroke="#fbbf24" stroke-width="1.6"/>
<text x="72" y="372" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="2">GOLD</text>
<text x="72" y="394" fill="#e8ecff" font-size="14">Prompt-ready context</text>
<text x="298" y="372" text-anchor="end" fill="#8b96bb" font-size="12">Redis</text><text x="183" y="448" text-anchor="middle" fill="#8b96bb" font-size="12" font-style="italic">medallion layers</text><circle cx="530" cy="300" r="132" fill="none" stroke="#243056" stroke-width="1.5"/>
<text x="530" y="158" text-anchor="middle" fill="#9b6bff" font-size="13" font-weight="700" letter-spacing="2">KNOWLEDGE GRAPH</text><line x1="470" y1="240" x2="585" y2="250" stroke="#243056" stroke-width="1.6"/><line x1="470" y1="240" x2="465" y2="350" stroke="#243056" stroke-width="1.6"/><line x1="585" y1="250" x2="600" y2="355" stroke="#243056" stroke-width="1.6"/><line x1="465" y1="350" x2="530" y2="300" stroke="#243056" stroke-width="1.6"/><line x1="585" y1="250" x2="530" y2="300" stroke="#243056" stroke-width="1.6"/><line x1="600" y1="355" x2="530" y2="300" stroke="#243056" stroke-width="1.6"/><line x1="470" y1="240" x2="530" y2="300" stroke="#243056" stroke-width="1.6"/><circle cx="470" cy="240" r="9" fill="#5b8cff"><animate attributeName="opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/></circle><text x="470" y="224" text-anchor="middle" fill="#8b96bb" font-size="12.5">Meeting</text><circle cx="585" cy="250" r="9" fill="#9b6bff"><animate attributeName="opacity" values="1;0.5;1" dur="4s" repeatCount="indefinite"/></circle><text x="585" y="234" text-anchor="middle" fill="#8b96bb" font-size="12.5">Task</text><circle cx="600" cy="355" r="9" fill="#f472b6"><animate attributeName="opacity" values="1;0.5;1" dur="5s" repeatCount="indefinite"/></circle><text x="600" y="383" text-anchor="middle" fill="#8b96bb" font-size="12.5">Person</text><circle cx="465" cy="350" r="9" fill="#9b6bff"><animate attributeName="opacity" values="1;0.5;1" dur="6s" repeatCount="indefinite"/></circle><text x="465" y="378" text-anchor="middle" fill="#8b96bb" font-size="12.5">Decision</text><circle cx="530" cy="300" r="12" fill="#e8ecff"><animate attributeName="opacity" values="1;0.5;1" dur="7s" repeatCount="indefinite"/></circle><text x="530" y="328" text-anchor="middle" fill="#8b96bb" font-size="12.5">Project</text><path d="M320,236 C360,236 380,270 396,286" stroke="#8b96bb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="730" y="170" width="220" height="86" rx="22" fill="#171d3f" stroke="#5b8cff" stroke-width="2"/>
<text x="840" y="204" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">RAG</text>
<text x="840" y="226" text-anchor="middle" fill="#5b8cff" font-size="12.5">vector search + recency boost</text>
<text x="840" y="244" text-anchor="middle" fill="#8b96bb" font-size="12">history that matters</text>
<rect x="730" y="300" width="220" height="86" rx="22" fill="#171d3f" stroke="#fbbf24" stroke-width="2"/>
<text x="840" y="334" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">CAG</text>
<text x="840" y="356" text-anchor="middle" fill="#fbbf24" font-size="12.5">pre-loaded Redis context</text>
<text x="840" y="374" text-anchor="middle" fill="#8b96bb" font-size="12">what is true right now</text>
<path d="M662,250 L724,214" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M320,382 C520,470 640,380 724,350" stroke="#8b96bb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/><rect x="995" y="230" width="160" height="70" rx="22" fill="#10172e" stroke="url(#g)" stroke-width="2.2"/>
<text x="1075" y="262" text-anchor="middle" fill="#e8ecff" font-size="16" font-weight="700">LLM call</text>
<text x="1075" y="282" text-anchor="middle" fill="#8b96bb" font-size="12">routed, with fallback</text>
<path d="M952,213 C975,213 975,250 990,258" stroke="#8b96bb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<path d="M952,343 C975,343 975,285 990,276" stroke="#8b96bb" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
<rect x="995" y="340" width="160" height="62" rx="22" fill="#0f2a24" stroke="#34d399" stroke-width="2"/>
<text x="1075" y="368" text-anchor="middle" fill="#e8ecff" font-size="15" font-weight="700">Human approval</text>
<text x="1075" y="387" text-anchor="middle" fill="#34d399" font-size="12">before any write</text>
<path d="M1075,302 L1075,334" stroke="#8b96bb" stroke-width="1.6" marker-end="url(#ar)"/>
</g></svg>