<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="How I build: one graph, one door, one human, measured">
<defs><clipPath id="r"><rect width="1200" height="210" rx="28"/></clipPath></defs><g clip-path="url(#r)" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><rect width="1200" height="210" fill="#0a0f1f"/><rect x="48" y="34" width="261" height="142" rx="24" fill="#10172e" stroke="#243056"/>
<text x="72" y="74" fill="#5b8cff" font-size="14" font-weight="700" letter-spacing="2">01</text>
<text x="72" y="108" fill="#e8ecff" font-size="22" font-weight="700">One graph</text><text x="72" y="136" fill="#8b96bb" font-size="13.5">Every fact points back to the</text><text x="72" y="155" fill="#8b96bb" font-size="13.5">document it came from.</text><rect x="329" y="34" width="261" height="142" rx="24" fill="#10172e" stroke="#243056"/>
<text x="353" y="74" fill="#9b6bff" font-size="14" font-weight="700" letter-spacing="2">02</text>
<text x="353" y="108" fill="#e8ecff" font-size="22" font-weight="700">One door</text><text x="353" y="136" fill="#8b96bb" font-size="13.5">Every model and tool call goes</text><text x="353" y="155" fill="#8b96bb" font-size="13.5">through one AI gateway.</text><rect x="610" y="34" width="261" height="142" rx="24" fill="#10172e" stroke="#243056"/>
<text x="634" y="74" fill="#34d399" font-size="14" font-weight="700" letter-spacing="2">03</text>
<text x="634" y="108" fill="#e8ecff" font-size="22" font-weight="700">One human</text><text x="634" y="136" fill="#8b96bb" font-size="13.5">The agent proposes, a person</text><text x="634" y="155" fill="#8b96bb" font-size="13.5">decides, the system records.</text><rect x="891" y="34" width="261" height="142" rx="24" fill="#10172e" stroke="#243056"/>
<text x="915" y="74" fill="#f472b6" font-size="14" font-weight="700" letter-spacing="2">04</text>
<text x="915" y="108" fill="#e8ecff" font-size="22" font-weight="700">Measured</text><text x="915" y="136" fill="#8b96bb" font-size="13.5">Evaluation on every change, a</text><text x="915" y="155" fill="#8b96bb" font-size="13.5">trace on every run.</text></g></svg>