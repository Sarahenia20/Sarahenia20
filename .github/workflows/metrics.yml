name: Profile stats
on:
  schedule:
    - cron: "0 4 * * *"   # every day, 05:00 Tunis
  workflow_dispatch:
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          base: header
          config_timezone: Africa/Tunis
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, shell, makefile, dockerfile
          committer_message: "chore: refresh profile stats [skip ci]"
